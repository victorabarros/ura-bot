# CI uses zarf/infra/scripts. Do not call Make. See AGENTS.md.
# fmt/validate on infra changes. Plan on same-repo PRs. Apply on main.
# cron-job.org allows 100 API requests/day, so this does not run on app-only changes.
# Terraform jobs run inside the pinned HashiCorp image. The GitHub-hosted runner
# stays ubuntu-24.04. actions/checkout and actions/github-script need Node, which
# that image does not have, so checkout uses the image's git client and the plan
# comment is a separate runner job.
name: Terraform

on:
  pull_request:
    paths:
      - "zarf/infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "zarf/infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

concurrency:
  group: terraform-cronjoborg
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/mnt" \
            -w /mnt \
            koalaman/shellcheck:stable \
            zarf/infra/scripts/common.sh \
            zarf/infra/scripts/fmt-validate.sh \
            zarf/infra/scripts/plan.sh \
            zarf/infra/scripts/apply.sh

  fmt-validate:
    name: fmt and validate
    runs-on: ubuntu-24.04
    container:
      image: hashicorp/terraform:1.17.2@sha256:6e9c1e647c31a960dc9b59e13272f9111d90010c10b717f77ffb324767660475
      options: --entrypoint ""
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q .
          git config --global --add safe.directory "$PWD"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --depth 1 --no-tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_REF"
          git checkout --force FETCH_HEAD

      - name: Format and validate
        run: sh zarf/infra/scripts/fmt-validate.sh

  plan:
    name: plan
    needs:
      - fmt-validate
      - shellcheck
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    container:
      image: hashicorp/terraform:1.17.2@sha256:6e9c1e647c31a960dc9b59e13272f9111d90010c10b717f77ffb324767660475
      options: --entrypoint ""
    outputs:
      summary: ${{ steps.plan.outputs.summary }}
    env:
      CRON_JOB_API_KEY: ${{ secrets.CRON_JOB_API_KEY }}
      TF_VAR_bot_api_key: ${{ secrets.API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q .
          git config --global --add safe.directory "$PWD"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --depth 1 --no-tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_REF"
          git checkout --force FETCH_HEAD

      - name: Plan
        id: plan
        run: |
          set -eu
          sh zarf/infra/scripts/plan.sh
          {
            echo "summary<<TF_PLAN_SUMMARY_END"
            cat plan-summary.txt
            echo "TF_PLAN_SUMMARY_END"
          } >> "$GITHUB_OUTPUT"

  plan-comment:
    name: comment
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment on the PR
        uses: actions/github-script@v7
        env:
          PLAN_SUMMARY: ${{ needs.plan.outputs.summary }}
        with:
          script: |
            const summary = process.env.PLAN_SUMMARY || ""
            const marker = "<!-- terraform-plan -->"
            const body = [
              marker,
              "#### Terraform plan",
              "",
              "```",
              summary.trim(),
              "```",
              "",
              "Addresses and actions only. Header values are not included.",
            ].join("\n")
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
              return
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })

  apply:
    name: apply
    needs:
      - fmt-validate
      - shellcheck
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    container:
      image: hashicorp/terraform:1.17.2@sha256:6e9c1e647c31a960dc9b59e13272f9111d90010c10b717f77ffb324767660475
      options: --entrypoint ""
    env:
      CRON_JOB_API_KEY: ${{ secrets.CRON_JOB_API_KEY }}
      TF_VAR_bot_api_key: ${{ secrets.API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q .
          git config --global --add safe.directory "$PWD"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --depth 1 --no-tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_REF"
          git checkout --force FETCH_HEAD

      - name: Plan and apply
        run: sh zarf/infra/scripts/apply.sh
