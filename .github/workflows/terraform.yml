# CI uses zarf/infra/scripts on the Ubuntu runner. Do not call Make. See AGENTS.md.
# fmt/validate on infra changes. Plan on same-repo PRs. Apply on main.
# cron-job.org allows 100 API requests/day, so this does not run on app-only changes.
name: Terraform

on:
  pull_request:
    paths:
      - "zarf/infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "zarf/infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

concurrency:
  group: terraform-cronjoborg
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/mnt" \
            -w /mnt \
            koalaman/shellcheck:stable \
            zarf/infra/scripts/common.sh \
            zarf/infra/scripts/fmt-validate.sh \
            zarf/infra/scripts/plan.sh \
            zarf/infra/scripts/apply.sh

  fmt-validate:
    name: fmt and validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Format and validate
        run: bash zarf/infra/scripts/fmt-validate.sh

  plan:
    name: plan
    needs:
      - fmt-validate
      - shellcheck
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    env:
      CRON_JOB_API_KEY: ${{ secrets.CRON_JOB_API_KEY }}
      TF_VAR_bot_api_key: ${{ secrets.API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Plan
        run: bash zarf/infra/scripts/plan.sh

      - name: Comment on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs")
            const summary = fs.readFileSync("plan-summary.txt", "utf8").trim()
            const marker = "<!-- terraform-plan -->"
            const body = [
              marker,
              "#### Terraform plan",
              "",
              "```",
              summary,
              "```",
              "",
              "Addresses and actions only. Header values are not included.",
            ].join("\n")
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
              return
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })

  apply:
    name: apply
    needs:
      - fmt-validate
      - shellcheck
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    env:
      CRON_JOB_API_KEY: ${{ secrets.CRON_JOB_API_KEY }}
      TF_VAR_bot_api_key: ${{ secrets.API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Plan and apply
        run: bash zarf/infra/scripts/apply.sh
